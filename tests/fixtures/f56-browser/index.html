<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salva Motoca! | Atendimento de teste</title><link rel="stylesheet" href="/fixture.css"><script src="/fixture.js" defer></script></head>
<body><main><header><p>DEMONSTRAÇÃO LOCAL — Identidade simulada</p><h1>Salva Motoca! | Atendimento</h1><p id="identity"></p><p>Sem pagamento real, localização física ou envio externo.</p></header>
<section aria-labelledby="stage-title"><h2 id="stage-title">Etapa do atendimento</h2><p id="stage" aria-live="polite">Carregando</p><p id="completion"></p><p id="gps"></p><p id="messages"></p><button id="refresh">Atualizar situação</button></section>
<section id="provider" hidden><h2>Prestador</h2><label><input type="checkbox" id="consent"> Compartilhar localização fictícia durante deslocamento</label>
<div class="actions"><button data-action="dispatch">Iniciar deslocamento</button><button data-action="location">Enviar amostra fictícia</button><button data-action="arrive">Confirmar chegada</button><button data-action="start">Iniciar serviço</button><button data-action="handoff">Concluir serviço</button></div>
<label for="summary">Resumo do serviço</label><textarea id="summary" maxlength="600">Serviço fictício executado para teste integrado.</textarea><button data-action="summary">Enviar resumo</button><button data-action="provider_confirm">Confirmar conclusão</button></section>
<section id="customer" hidden><h2>Solicitante</h2><p id="received-summary"></p><label><input type="checkbox" id="summaryRead"> Li o resumo</label><button data-action="customer_confirm">Confirmar atendimento</button><label for="stars">Avaliação</label><select id="stars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button data-action="rating">Avaliar prestador</button></section>
<section id="participant" hidden><h2>Conversa e suporte</h2><label for="body">Mensagem fictícia</label><textarea id="body" maxlength="2000"></textarea><button data-action="message">Enviar mensagem</button><button data-action="dispute">Registrar divergência</button><button data-action="support_message">Mensagem ao suporte</button></section>
<p id="feedback" role="status" aria-live="polite"></p><footer>Ambiente de ensaio descartável. RELEASE=NO_GO.</footer></main></body></html>
