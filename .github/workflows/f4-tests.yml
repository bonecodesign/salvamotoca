name: F4 - finanças offline sem cobrança real
on:
  pull_request:
    paths:
      - 'f4-finance.js'
      - 'config.js'
      - 'docs/F4_*.md'
      - 'docs/F4_PREVIEW.html'
      - 'tests/f4-*.js'
      - 'f4-mock-webhook.js'
      - 'tests/f4-rollback-guard.sh'
      - 'tests/f4-concurrency.sh'
      - 'tests/f4-risk-race.sh'
      - 'tests/f4-*.sql'
      - 'supabase/drafts/f4_financial_backend_candidate.sql'
      - 'supabase/drafts/f4_double_entry_mock_candidate.sql'
      - 'supabase/drafts/f4_risk_settlement_mock_candidate.sql'
      - 'supabase/rollback/f4_risk_only_if_empty.sql'
      - 'supabase/rollback/f4_double_entry_only_if_empty.sql'
      - 'tests/f4-double-entry-rollback-guard.sh'
      - 'supabase/rollback/f4_only_if_empty.sql'
      - '.github/workflows/f4-tests.yml'
  push:
    branches:
      - 'feat/f4-pagamentos-protegidos-simulador-seguro'
    paths:
      - 'f4-finance.js'
      - 'config.js'
      - 'docs/F4_*.md'
      - 'docs/F4_PREVIEW.html'
      - 'tests/f4-*.js'
      - 'f4-mock-webhook.js'
      - 'tests/f4-rollback-guard.sh'
      - 'tests/f4-concurrency.sh'
      - 'tests/f4-risk-race.sh'
      - 'tests/f4-*.sql'
      - 'supabase/drafts/f4_financial_backend_candidate.sql'
      - 'supabase/drafts/f4_double_entry_mock_candidate.sql'
      - 'supabase/drafts/f4_risk_settlement_mock_candidate.sql'
      - 'supabase/rollback/f4_risk_only_if_empty.sql'
      - 'supabase/rollback/f4_double_entry_only_if_empty.sql'
      - 'tests/f4-double-entry-rollback-guard.sh'
      - 'supabase/rollback/f4_only_if_empty.sql'
      - '.github/workflows/f4-tests.yml'
permissions:
  contents: read
jobs:
  regras-f4:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe sem bibliotecas financeiras de produção
        run: |
          node --check f4-finance.js
          node --check f4-mock-webhook.js
          node --check f3-tow.js
          node --check live-app-current.js
      - name: Simulações financeiras + guardas sem checkout
        run: node --test tests/f4-finance.test.js tests/f4-release-guard.test.js tests/f4-mock-webhook.test.js
      - name: Regressão do motor de prestadores, reboque e flags
        run: |
          node --test tests/f2-flow.test.js tests/f3-tow.test.js
          node --test tests/f1-release-guard.test.js tests/f2-release-guard.test.js tests/f3-release-guard.test.js
  chrome-f4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Usar Chrome/Chromium do runner
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Navegador indisponível" >&2; exit 1
          fi
      - name: Instalar somente Playwright Core pinado, sem instalar navegador
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Testar prévia F4 offline em Chrome desktop/celular
        run: node --test tests/f4-browser.test.js

  postgres-f4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f4_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f4_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: f4_disposable
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL local
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Schema F2 em Postgres descartável
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/f2-stage-setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f2_backend_candidate.sql
      - name: Backend candidato F4 local, sem API financeira
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f4_financial_backend_candidate.sql
      - name: Homologar isolamento, comissão e eventos idempotentes sem PSP
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f4-stage-rls.sql
      - name: Confirmar que testes não gravaram dinheiro ou pedidos
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atqc "select not enabled from private.f4_release_gate where singleton" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from private.f4_mock_payment_attempts" | grep -qx 0
          psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.service_requests" | grep -qx 0
      - name: Bloquear rollback se F4 ativada ou com dados financeiros
        run: bash tests/f4-rollback-guard.sh
      - name: Ensaiar rollback F4 sem dados preservando banco F2
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/rollback/f4_only_if_empty.sql
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('private.f4_mock_payment_attempts') is null" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('public.f2_request_offers') is not null" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('public.service_requests') is not null" | grep -qx t
      - name: Recriar modelo local e disputar o mesmo evento fictício em duas sessões
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f4_financial_backend_candidate.sql
          bash tests/f4-concurrency.sh
      - name: Instalar camada mock de partidas dobradas somente no container
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f4_double_entry_mock_candidate.sql
      - name: Validar equilíbrio contábil no commit, estorno, disputa e não repasse
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f4-double-entry.sql
      - name: Provar que a verificação não persistiu dinheiro ou status pago
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atqc "select not enabled from private.f4_release_gate where singleton" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from private.f4_mock_journals" | grep -qx 0
          psql -X -v ON_ERROR_STOP=1 -Atqc "select status from public.service_requests limit 1" | grep -qx awaiting_payment
      - name: Negar reversão com dados/gate e remover só camada contábil vazia
        run: bash tests/f4-double-entry-rollback-guard.sh
      - name: Recriar journal de teste e instalar extensão de risco privada
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f4_double_entry_mock_candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f4_risk_settlement_mock_candidate.sql
      - name: Exercitar estornos parciais, disputas e revisão idempotente fictícia
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f4-risk-settlement.sql
      - name: Validar ausência de persistência dos cenários
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atqc "select not enabled from private.f4_release_gate where singleton" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from private.f4_mock_risk_cases" | grep -qx 0
          psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from private.f4_mock_settlement_intents" | grep -qx 0
      - name: Testar reservas parciais concorrentes e rollback de risco protegido
        run: bash tests/f4-risk-race.sh
      - name: Confirmar que a fase financeira continua inativa
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atqc "select not enabled from private.f4_release_gate where singleton" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('private.f4_mock_risk_cases') is null" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('private.f4_mock_journals') is not null" | grep -qx t


