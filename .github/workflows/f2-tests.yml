name: F2 - simulador e regras (sem atendimentos)
on:
  pull_request:
    paths:
      - 'config.js'
      - 'index.html'
      - 'sw.js'
      - 'live-app-current.js'
      - 'f2-flow.js'
      - 'docs/F2_PREVIEW.html'
      - 'docs/F2_DEPENDENCIAS_E_PLANO.md'
      - 'tests/f2-flow.test.js'
      - 'tests/f2-browser.test.js'
      - 'tests/f2-integrated-browser.test.js'
      - 'tests/f2-release-guard.test.js'
      - 'tests/f2-stage-setup.sql'
      - 'tests/f2-stage-rls.sql'
      - 'tests/f2-concurrency-setup.sql'
      - 'tests/f2-concurrency.sh'
      - 'supabase/drafts/f2_backend_candidate.sql'
      - 'supabase/rollback/f2_only_if_empty.sql'
      - '.github/workflows/f2-tests.yml'
  push:
    branches:
      - 'feat/f2-prestadores-distribuicao-orcamentos-segura'
    paths:
      - 'config.js'
      - 'index.html'
      - 'sw.js'
      - 'live-app-current.js'
      - 'f2-flow.js'
      - 'docs/F2_PREVIEW.html'
      - 'tests/f2-flow.test.js'
      - 'tests/f2-browser.test.js'
      - 'tests/f2-integrated-browser.test.js'
      - 'tests/f2-release-guard.test.js'
      - 'tests/f2-stage-setup.sql'
      - 'tests/f2-stage-rls.sql'
      - 'tests/f2-concurrency-setup.sql'
      - 'tests/f2-concurrency.sh'
      - 'supabase/drafts/f2_backend_candidate.sql'
      - 'supabase/rollback/f2_only_if_empty.sql'
      - '.github/workflows/f2-tests.yml'
permissions:
  contents: read
jobs:
  regras-f2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar F2 e módulo puro
        run: |
          node --check f2-flow.js
          node --check live-app-current.js
          node --check sw.js
          node --test tests/f2-flow.test.js tests/f2-release-guard.test.js
      - name: Confirmar que a F1 continua desligada
        run: |
          node --test tests/f1-release-guard.test.js
          grep -q 'f1TestRequestsEnabled: false' config.js
      - name: Garantir que F2 não conecta APIs ou grava dados
        run: |
          if grep -E 'fetch\(|createClient\(|\.rpc\(|\.upload\(|service_role|sb_secret_' f2-flow.js docs/F2_PREVIEW.html; then
            echo 'A F2 demonstrativa não pode conter SDK, rede ou credenciais'
            exit 1
          fi
  chrome-f2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Localizar navegador real
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome/Chromium indisponível" >&2
            exit 1
          fi
      - name: Instalar somente Playwright Core pinado
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Ensaiar prévia F2 offline em desktop e celular
        run: node --test tests/f2-browser.test.js tests/f2-integrated-browser.test.js

  postgres-f2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f2_homologacao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f2_homologacao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: f2_homologacao
    steps:
      - uses: actions/checkout@v4
      - name: Verificar cliente PostgreSQL 17
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Criar somente fixtures locais sem Supabase remoto
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f2-stage-setup.sql
      - name: Testar candidato F2 no container descartável
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/f2_backend_candidate.sql
      - name: Ensaiar RLS, convites, itens e escolha única
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f2-stage-rls.sql
      - name: Testar dois aceites concorrentes no mesmo pedido (SQL local)
        run: bash tests/f2-concurrency.sh
      - name: Reconfirmar gate DESLIGADO em banco limpo
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atqc "select not enabled from private.f2_release_gate where singleton" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.f2_request_offers" | grep -qx 0
      - name: Homologar rollback F2 apenas com dados zerados
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/rollback/f2_only_if_empty.sql
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('public.f2_request_offers') is null" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('public.f2_quote_items') is null" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('public.service_requests') is not null" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -Atqc "select to_regclass('public.providers') is not null" | grep -qx t
