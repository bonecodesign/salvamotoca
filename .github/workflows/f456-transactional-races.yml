name: "F4-F6 Transactional safety: PostgreSQL 17 offline race"
on:
  pull_request:
    paths:
      - "tests/f456-transactional-fixture.sql"
      - "tests/f456-transactional-adversarial.sql"
      - "tests/f456-transactional-race.sh"
      - "tests/f456-transactional-guards.test.mjs"
      - "docs/F456_TRANSACTIONAL_IDEMPOTENCY.md"
      - ".github/workflows/f456-transactional-races.yml"
  push:
    branches:
      - "feat/f456-transactional-idempotency-races-offline"
    paths:
      - "tests/f456-transactional-fixture.sql"
      - "tests/f456-transactional-adversarial.sql"
      - "tests/f456-transactional-race.sh"
      - "tests/f456-transactional-guards.test.mjs"
      - "docs/F456_TRANSACTIONAL_IDEMPOTENCY.md"
      - ".github/workflows/f456-transactional-races.yml"
permissions:
  contents: read
jobs:
  race-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f456_race_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f456_race_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: f456_race_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure psql is installed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Verify no live release and static contracts
        run: |
          node --test tests/f456-transactional-guards.test.mjs
          node scripts/release-readiness-offline.mjs > "$RUNNER_TEMP/release-status.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/release-status.json');if(r.decision!=='NO_GO'||r.g1!=='BLOCKED')process.exit(1)"
      - name: Install entirely disposable transaction model
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f456-transactional-fixture.sql
      - name: Adversarial checks (transaction ROLLBACK)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f456-transactional-adversarial.sql
      - name: Confirm no leakage from adversarial rollback
        run: |
          psql -X -Atqc "select not enabled from private.f456_mock_gate where singleton" | grep -qx t
          psql -X -Atqc "select count(*)=0 from private.f456_mock_events" | grep -qx t
          psql -X -Atqc "select count(*)=0 from private.f456_mock_journal" | grep -qx t
      - name: Race actual two database sessions, no PSP, no dispatch
        run: bash tests/f456-transactional-race.sh
      - name: Confirm no real permissions granted
        run: |
          psql -X -Atqc "select not enabled from private.f456_mock_gate where singleton" | grep -qx t
          psql -X -Atqc "select bool_and(not real_transfer_authorized and not real_payment_verified and not real_dispatch_authorized) from private.f456_mock_sessions" | grep -qx t
          psql -X -Atqc "select not has_function_privilege('authenticated','private.f456_apply_mock_event(uuid,text,text,uuid,bigint,integer,boolean)','EXECUTE')" | grep -qx t
          echo "HOSTED_SUPABASE_WRITES=NONE"
          echo "PSP_WEBHOOK=NOT_TESTED"
          echo "REAL_CONCURRENCY=NOT_IMPLEMENTED"
          echo "F1_BACKUP_RESTORE=BLOCKED"
          echo "RELEASE=NO_GO"
