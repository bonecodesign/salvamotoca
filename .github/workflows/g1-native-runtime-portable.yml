name: "G1 — pacote público de ferramentas Supabase Native"
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PREPARAR_RUNTIME_PUBLICO (sem backup nem secrets)"
        required: true
        type: string
concurrency:
  group: g1-public-native-runtime
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  public-runtime-only:
    if: github.repository == 'bonecodesign/salvamotoca' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'PREPARAR_RUNTIME_PUBLICO'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_EXPERIMENTAL_STACK: "1"
      SUPABASE_YES: "1"
    steps:
      - name: "Comprovar transporte de artefato público pequeno"
        shell: bash
        run: |
          printf "%s\n" "SALVAMOTOCA_G1_PUBLIC_RUNTIME_TRANSPORT_V1" > "$RUNNER_TEMP/g1-transport-probe.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: g1-public-transport-probe
          path: "${{ runner.temp }}/g1-transport-probe.txt"
          retention-days: 1
      - name: "Obter somente executáveis oficiais, sem checkout ou secrets"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SUPABASE_HOME="$RUNNER_TEMP/g1-native-public-home"
          mkdir -p "$RUNNER_TEMP/g1-public-pack" "$RUNNER_TEMP/g1-public-bin" "$RUNNER_TEMP/g1-public-project"
          cd "$RUNNER_TEMP/g1-public-pack"
          base='https://github.com/supabase/cli/releases/download/v3.2.0'
          filename='supabase_3.2.0_linux_amd64.tar.gz'
          curl --fail --silent --show-error --location --proto '=https' "$base/$filename" -o "$filename"
          curl --fail --silent --show-error --location --proto '=https' "$base/checksums.txt" -o checksums.txt
          awk -v f="$filename" '$2==f || $2=="*"f {print}' checksums.txt > cli.sha256
          test "$(wc -l < cli.sha256)" = 1
          sha256sum --check cli.sha256
          tar -xzf "$filename" -C "$RUNNER_TEMP/g1-public-bin" supabase
          export PATH="$RUNNER_TEMP/g1-public-bin:$PATH"
          test "$(supabase --version)" = 3.2.0
          sudo apt-get install -y age >/dev/null
          cp "$(command -v age)" "$(command -v age-keygen)" .
          sha256sum age age-keygen > age.sha256
          cd "$RUNNER_TEMP/g1-public-project"
          supabase init > "$RUNNER_TEMP/g1-native-init.log" 2>&1 || { cat "$RUNNER_TEMP/g1-native-init.log"; exit 1; }
          echo G1_NATIVE_INIT=PASS
          python3 - <<'PY'
          import pathlib, re, tomllib
          p=pathlib.Path('supabase/config.toml')
          s=p.read_text()
          s,n=re.subn(r'(?m)^major_version\s*=\s*\d+\s*$', 'major_version = 17',s)
          assert n==1
          # Disable optional services that are not required for the recovery database.
          sections={'studio','realtime','analytics','edge_runtime','inbucket','local_smtp','imgproxy'}
          lines=s.splitlines()
          section=''
          for i,line in enumerate(lines):
              m=re.fullmatch(r'\[([^\]]+)\]',line.strip())
              if m: section=m.group(1)
              if section in sections and re.match(r'^\s*enabled\s*=',line):
                  lines[i]='enabled = false'
          s='\n'.join(lines)+'\n'
          assert tomllib.loads(s)['db']['major_version']==17
          p.write_text(s)
          PY
          supabase stack install --help > "$RUNNER_TEMP/g1-native-help.log" 2>&1
          grep -q -- '--runtime' "$RUNNER_TEMP/g1-native-help.log" || { cat "$RUNNER_TEMP/g1-native-help.log"; exit 1; }
          echo G1_NATIVE_INSTALL_HELP=PASS
          # Only download published service archives. Do not start or link any project.
          if ! supabase stack install --runtime native > "$RUNNER_TEMP/g1-native-prepare.log" 2>&1; then
            cat "$RUNNER_TEMP/g1-native-prepare.log"
            echo 'G1_NATIVE_PREPARE=BLOCKED'
            exit 2
          fi
          cat "$RUNNER_TEMP/g1-native-prepare.log"
          test -d "$SUPABASE_HOME/cache/stack"
          test -n "$(find "$SUPABASE_HOME/cache/stack" -type f -print -quit)"
          cd "$RUNNER_TEMP/g1-public-pack"
          cp "$RUNNER_TEMP/g1-public-project/supabase/config.toml" config.toml
          cp "$RUNNER_TEMP/g1-public-project/supabase/supabase.lock" supabase.lock
          # Use the verified cache, selecting only postgres, auth, storage and postgrest.
          cache="$SUPABASE_HOME/cache/stack/slim-services"
          test -d "$cache/postgres"
          find "$cache" -mindepth 1 -maxdepth 1 -type d -printf '%f\n'
          for service in postgres auth storage postgrest; do
            test -d "$cache/$service"
            tar -czf "$service.tar.gz" -C "$SUPABASE_HOME/cache" "stack/slim-services/$service"
          done
          test -s postgres.tar.gz
          # Retain exact bytes and checksums; split public payload into independently transferable chunks.
          sha256sum ./*.tar.gz age age-keygen config.toml supabase.lock > runtime.sha256
          mkdir "$RUNNER_TEMP/g1-public-chunks"
          for file in ./*.tar.gz; do
            split -b 24000000 -d -a 3 "$file" "$RUNNER_TEMP/g1-public-chunks/$(basename "$file").part-"
          done
          cp age age-keygen config.toml supabase.lock runtime.sha256 cli.sha256 "$RUNNER_TEMP/g1-public-chunks/"
          bytes="$(du -sb "$RUNNER_TEMP/g1-public-chunks" | cut -f1)"
          echo "G1_PUBLIC_RUNTIME_BYTES=$bytes"
          if (( bytes > 400000000 )); then echo 'G1_PUBLIC_RUNTIME_TOO_LARGE=BLOCKED'; exit 3; fi
          echo 'G1_PUBLIC_RUNTIME_PREPARED=PASS'
          echo 'G1_REAL_BACKUP_ACCESSED=FALSE'
          echo 'G1_REAL_RESTORE=NOT_EXECUTED'
      - name: "Transferir exclusivamente ferramentas públicas"
        uses: actions/upload-artifact@v4
        with:
          name: g1-native-runtime-public-linux-amd64
          path: "${{ runner.temp }}/g1-public-chunks/"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
