name: "G1 — verificação ÚNICA de autenticação PostgreSQL (somente leitura)"
on:
  push:
    branches:
      - main
    paths:
      - "ops/g1-triggers/only-auth-20261121.txt"
permissions:
  contents: read
concurrency:
  group: g1-oneshot-20261121-readonly
  cancel-in-progress: false
jobs:
  authenticated-only:
    if: github.repository == 'bonecodesign/salvamotoca' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    name: "Somente SELECT 1; não exportar nem usar Dropbox"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: g1-backup-testes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Instalar cliente PostgreSQL"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: "Diagnóstico ÚNICO do login do ambiente protegido"
        shell: bash
        env:
          G1_SUPABASE_DB_URL: ${{ secrets.G1_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "bonecodesign/salvamotoca" ]]
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          import sys

          expected = "G1_DIAGNOSTICO_POSTGRES_TESTES_UMA_VEZ_20261121\n"
          marker = Path("ops/g1-triggers/only-auth-20261121.txt")
          if not marker.is_file() or marker.read_text(encoding="utf-8") != expected:
              print("G1_AUTH_ONCE=REJECTED:INVALID_MARKER")
              sys.exit(2)

          # Reuses the tested secret-safe checker without bypassing any URI validation.
          probe = runpy.run_path("scripts/g1-auth-readonly-probe.py",
                                 run_name="g1_one_shot_import")
          authenticated, category = probe["run_probe"]()
          if authenticated:
              print("G1_AUTH_ONCE=PASS:READ_ONLY_CONNECTION_OK")
          else:
              print("G1_AUTH_ONCE=FAIL:" + category)
          print("G1_REAL_BACKUP=NOT_ATTEMPTED")
          print("G1_DROPBOX_UPLOAD=NOT_ATTEMPTED")
          print("G1=BLOCKED")
          print("RELEASE=NO_GO")
          sys.exit(0 if authenticated else 2)
          PY
