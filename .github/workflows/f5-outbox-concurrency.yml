name: "F5 - fila transacional de avisos MOCK, sem notificacoes reais"
on:
  pull_request:
    paths:
      - "tests/f5-outbox-fixture.sql"
      - "tests/f5-outbox-adversarial.sql"
      - "tests/f5-outbox-race.sh"
      - "tests/f5-outbox-contract.test.mjs"
      - "docs/F5_OUTBOX_CONCURRENCY_OFFLINE.md"
      - ".github/workflows/f5-outbox-concurrency.yml"
  push:
    branches:
      - "feat/f5-idempotent-notification-outbox-mock"
    paths:
      - "tests/f5-outbox-fixture.sql"
      - "tests/f5-outbox-adversarial.sql"
      - "tests/f5-outbox-race.sh"
      - "tests/f5-outbox-contract.test.mjs"
      - "docs/F5_OUTBOX_CONCURRENCY_OFFLINE.md"
      - ".github/workflows/f5-outbox-concurrency.yml"
permissions:
  contents: read
jobs:
  postgres-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f456_race_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f456_race_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: f456_race_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Validar contrato F5 e negar GO real
        run: |
          node --test tests/f5-outbox-contract.test.mjs
          node scripts/release-readiness-offline.mjs > "$RUNNER_TEMP/no-go.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/no-go.json');if(r.decision!=='NO_GO'||r.g1!=='BLOCKED')process.exit(1)"
      - name: Carregar apenas modelos PostgreSQL isolados F4-F6 e outbox F5
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/f456-transactional-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/f5-outbox-fixture.sql
      - name: Exercitar retry, chegada, disputa e rollback na fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/f5-outbox-adversarial.sql
      - name: Provar rollback completo antes das corridas
        run: |
          psql -X -Atqc "select not enabled from private.f456_mock_gate where singleton" | grep -qx t
          psql -X -Atqc "select count(*)=0 from private.f5_mock_outbox" | grep -qx t
          psql -X -Atqc "select count(*)=0 from private.f456_mock_events" | grep -qx t
      - name: Duas sessoes PostgreSQL concorrentes e lease expirado
        run: bash tests/f5-outbox-race.sh
      - name: Garantias F5 de nao enviarmos notificacoes reais
        run: |
          psql -X -Atqc "select not enabled from private.f456_mock_gate where singleton" | grep -qx t
          psql -X -Atqc "select count(*)=1 from private.f5_mock_outbox where status='acked_mock'" | grep -qx t
          psql -X -Atqc "select not has_function_privilege('authenticated','private.f5_mock_outbox_claim(text,bigint)','EXECUTE')" | grep -qx t
          echo 'DEVICE_LOCAL_TESTS=NOT_RUN_WAITING_FOR_USER_SELECTED_FOLDER'
          echo 'OUTBOUND_NOTIFICATION_REAL=ZERO'
          echo 'SUPABASE_HOSTED_CHANGES=NONE'
          echo 'PSP_RECEIPT_REAL=NOT_TESTED'
          echo 'G1=BLOCKED'
          echo 'RELEASE=NO_GO'
