name: F4-F6 - integração financeira exclusivamente offline
on:
  pull_request:
    paths:
      - 'f456-financial-bridge-offline.js'
      - 'f2-flow.js'
      - 'f3-tow.js'
      - 'f4-finance.js'
      - 'f5-offline-flow.js'
      - 'f6-offline-completion.js'
      - 'tests/f456-financial-bridge-offline.test.js'
      - '.github/workflows/f456-integration-tests.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrato financeiro e fluxo fictício
        run: |
          node --check f456-financial-bridge-offline.js
          node --test tests/f2-flow.test.js tests/f3-tow.test.js tests/f4-finance.test.js tests/f456-financial-bridge-offline.test.js tests/f5-offline-flow.test.js tests/f6-offline-completion.test.js
      - name: Guardas de liberação
        run: |
          node --test tests/f1-release-guard.test.js tests/f2-release-guard.test.js tests/f3-release-guard.test.js tests/f4-release-guard.test.js tests/f5-release-guard.test.js tests/f6-release-guard.test.js
          echo 'HOSTED_WRITES=NONE'
          echo 'PSP_REAL=NOT_TESTED'
          echo 'RELEASE=NO_GO'
